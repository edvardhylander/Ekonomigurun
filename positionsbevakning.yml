name: Positionsbevakning

on:
  workflow_dispatch:       # startas av dashboarden när du registrerar ett köp
  schedule:
    - cron: '17 * * * *'   # varje timme: startar bevakningen igen om det finns öppna positioner

permissions:
  contents: write

concurrency:
  group: positionsbevakning
  cancel-in-progress: false

jobs:
  bevaka:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Finns det öppna positioner?
        id: koll
        run: node -e "let n=0; try { n=(require('./docs/positioner.json').positioner||[]).length } catch {} console.log('antal='+n)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.koll.outputs.antal != '0'
        with:
          node-version: 22

      - name: Bevaka positionerna (var 2–3:e minut i upp till ca 6 timmar)
        if: steps.koll.outputs.antal != '0'
        run: |
          git config user.name "guldbot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/positioner.mjs
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
