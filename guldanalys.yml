name: Guldanalys

on:
  schedule:
    - cron: '7 * * * *'    # varje timme: kortsiktiga lägen (GitHub kan ibland vara några minuter sen)
    - cron: '23 5 * * *'   # varje morgon 06:23 svensk vintertid: längre lägen på dagsstaplar
  workflow_dispatch:         # "Run workflow" i GitHub, även i mobilappen
    inputs:
      lage:
        description: 'Vad ska köras?'
        type: choice
        options: [båda, timme, dag]
        default: båda

permissions:
  contents: write

concurrency:
  group: guldanalys
  cancel-in-progress: false

jobs:
  analys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Analysera marknaderna och skicka notiser
        run: node scripts/run.mjs
        env:
          LAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.lage || (github.event.schedule == '23 5 * * *' && 'dag' || 'timme') }}
          TVINGA: ${{ github.event_name == 'workflow_dispatch' && 'ja' || '' }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTISNIVAER: ${{ vars.NOTISNIVAER }}
          NOTIS_SETUP: ${{ vars.NOTIS_SETUP }}
          NOTIS_LANGRE: ${{ vars.NOTIS_LANGRE }}

      - name: Spara analysen till dashboarden
        run: |
          git config user.name "guldbot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Ingen ändring att spara."
          else
            git commit -m "Analys $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --quiet
            git push
          fi
