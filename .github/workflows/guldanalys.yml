name: Guldanalys

on:
  schedule:
    - cron: '7 * * * *'   # varje timme, sju minuter över (GitHub kan ibland vara några minuter sen)
  workflow_dispatch:        # gör att du kan köra den direkt via "Run workflow" i GitHub (även i mobilappen)

permissions:
  contents: write

concurrency:
  group: guldanalys
  cancel-in-progress: false

jobs:
  analys:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Analysera guldpriset och skicka notiser
        run: node scripts/run.mjs
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTISNIVAER: ${{ vars.NOTISNIVAER }}
          NOTIS_SETUP: ${{ vars.NOTIS_SETUP }}

      - name: Spara analysen till dashboarden
        run: |
          git config user.name "guldbot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "Ingen ändring att spara."
          else
            git commit -m "Analys $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --quiet
            git push
          fi
